[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stockex-harness"
dynamic = ["version"]
description = "Evidence-first Indian equity research, point-in-time data, and walk-forward evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
stockex = "stockex.cli:main"

[tool.setuptools.dynamic]
version = {attr = "stockex.__version__"}

[tool.setuptools.packages.find]
include = ["stockex*", "scripts*"]
namespaces = true
