name: Harness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -q
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/stockex-wheels .
      - run: python -m pip install --no-deps /tmp/stockex-wheels/*.whl
      - name: Check installed CLI outside the checkout
        working-directory: /tmp
        run: |
          stockex --help
          stockex research-synthesize "$GITHUB_WORKSPACE/tests/fixtures/research-synthesis.json" --out "$RUNNER_TEMP/research-bundle"
          stockex research-verify "$RUNNER_TEMP/research-bundle"
