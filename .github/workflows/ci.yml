name: Harness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -q
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/stockex-wheels .
      - run: python -m pip install --no-deps /tmp/stockex-wheels/*.whl
      - name: Check installed CLI outside the checkout
        working-directory: /tmp
        run: stockex --help
